<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- ========================================== -->
  <!-- 1. REGLAS GLOBALES (Texto normal, pequeño) -->
  <!-- ========================================== -->
  <match target="font">
    <edit mode="assign" name="antialias"><bool>true</bool></edit>
    <edit mode="assign" name="embeddedbitmap"><bool>false</bool></edit>
    
    <!-- Mantenemos el hinting ligero para que el texto de leer se vea nítido -->
    <edit mode="assign" name="hinting"><bool>true</bool></edit>
    <edit mode="assign" name="hintstyle"><const>hintslight</const></edit>
    
    <edit mode="assign" name="lcdfilter"><const>lcddefault</const></edit>
    <edit mode="assign" name="rgba"><const>rgb</const></edit>
    
    <!-- Nota: Quité 'autohint' o lo puse en false. 
         Forzar el autohint suele arruinar fuentes modernas como Noto o Inter
         que ya tienen su propio hinting nativo perfecto. -->
    <edit mode="assign" name="autohint"><bool>false</bool></edit>
  </match>

  <!-- ========================================== -->
  <!-- 2. TEXTOS GRANDES (Pixelsize mayor a 15)   -->
  <!-- ========================================== -->
  <match target="font">
    <test name="pixelsize" qual="any" compare="more"><double>15</double></test>
    <!-- A partir de cierto tamaño, el hinting deforma y no ayuda -->
    <edit mode="assign" name="hintstyle"><const>hintnone</const></edit>
    <edit mode="assign" name="lcdfilter"><const>lcdlight</const></edit>
  </match>

  <!-- ========================================== -->
  <!-- 3. NEGRITAS (Bold)                         -->
  <!-- ========================================== -->
  <match target="font">
    <test name="weight" compare="more"><const>medium</const></test>
    <!-- Quitamos el hinting a las negritas para que no se vean "cuadradas" -->
    <edit mode="assign" name="hintstyle"><const>hintnone</const></edit>
    <edit mode="assign" name="lcdfilter"><const>lcdlight</const></edit>
  </match>

  <!-- ========================================== -->
  <!-- 4. CURSIVAS (Italics)                      -->
  <!-- ========================================== -->
  <match target="font">
    <test name="slant" compare="not_eq"><double>0</double></test>
    <!-- Quitamos el hinting a las cursivas para mantener las curvas suaves -->
    <edit mode="assign" name="hintstyle"><const>hintnone</const></edit>
    <edit mode="assign" name="lcdfilter"><const>lcdlight</const></edit>
  </match>

</fontconfig>
