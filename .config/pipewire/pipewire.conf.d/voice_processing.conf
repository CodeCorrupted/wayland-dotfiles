 context.modules = [{
   name = libpipewire-module-filter-chain
   args = {
       filter.graph = {
           nodes = [
               # High-pass filter - kills plosive rumble below ~80Hz
               {
                   type   = builtin
                   name   = hp
                   label  = bq_highpass
                   control = {
                       "Freq"  = 90
                       "Q"     = 0.707
                   }
               }
               # De-esser (LSP)
               {
                   type    = lv2
                   plugin  = "http://calf.sourceforge.net/plugins/Deesser"
                   name    = deesser
                   control = {
                       detection = 0        # 0=RMS, 1=Peak
                       mode      = 1        # 0=Wide, 1=Split
                       threshold = 0.18     # ~ -15 dB linear
                       ratio     = 4.0
                       laxity    = 15
                       f1_freq   = 6500.0   # "Split" crossover
                       f2_freq   = 6500.0   # "Peak" detection center
                   }
               }
               # Voice EQ (Calf)
               {
                   type    = lv2
                   plugin  = "http://calf.sourceforge.net/plugins/Equalizer5Band"
                   name    = eq
                   control = {
                       ls_active = 1
                       ls_freq   = 100.0
                       ls_level  = 0.668    # -3 dB, reduce mud
                       p1_active = 1
                       p1_freq   = 300.0
                       p1_q      = 1.0
                       p1_level  = 0.794    # -2 dB, boxiness
                       p2_active = 1
                       p2_freq   = 3000.0
                       p2_q      = 1.0
                       p2_level  = 1.259    # +2 dB, presence
                       hs_active = 1
                       hs_freq   = 9000.0
                       hs_level  = 0.708    # -3 dB, tame harshness
                   }
               }
               # Compressor (Calf)
               {
                   type    = lv2
                   plugin  = "http://calf.sourceforge.net/plugins/Compressor"
                   name    = comp
                   control = {
                       threshold = 0.125    # ~ -18 dB linear
                       ratio     = 3.0
                       attack    = 10.0
                       release   = 100.0
                       makeup    = 1.585    # ~ +4 dB linear
                   }
               }
           ]
           # this can be combined with the noise suppression plugin detailed
           # on the PipeWire wiki page by uncommenting the links[] lines below
           # and changing the input
           links = [
               #{ output = "rnnoise:Output"  input = "gate:Input" }
               #{ output = "gate:Output"     input = "hp:In" }
               { output = "hp:Out"          input = "deesser:in_l" }
               { output = "deesser:out_l"   input = "eq:in_l" }
               { output = "eq:out_l"        input = "comp:in_l" }
           ]
           #inputs = [ "rnnoise:Input" ]
           inputs = [ "hp:In" ]
           outputs = [ "comp:out_l" ]
       }
       capture.props = {
           node.name           = "capture.voice_processing"
           node.description    = "Voice processing capture"
           media.name          = "Voice processing capture"
           node.passive        = true
           audio.rate          = 48000
           audio.position      = [ FL ]
           # if combining with the noise suppression example above, use 
           # node.target to specify the input rather than stream.capture.sink
           # which targets the input fallback
           #node.target         = "source_ec"
           stream.capture.sink = true
       }
       playback.props = {
           node.name           = "voice_processing_source"
           node.description    = "Voice processing source"
           media.name          = "Voice processing source"
           media.class         = "Audio/Source"
           audio.rate          = 48000
           audio.position      = [ FL ]
       }
   }
 }]
